name: Database tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".squawk.toml"
      - ".github/workflows/db-test.yml"

jobs:
  squawk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter supplystash
      - name: Lint migrations
        run: pnpm db:lint

  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots Postgres + the auth service (tests create users) and skips the
      # rest — studio, realtime, storage etc. add minutes and nothing else.
      - name: Start Supabase
        run: >
          supabase start
          -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit

      # `supabase start` applies every migration in supabase/migrations, so a
      # green run here also proves the migration chain still applies cleanly.
      - name: Run pgTAP tests
        run: supabase test db
