pre-commit:
  parallel: true
  jobs:
    # Call the binaries by path rather than through `pnpm`: pnpm's
    # verify-deps-before-run check can trigger an interactive reinstall prompt,
    # which hangs forever in a hook (no TTY). lefthook does NOT put
    # node_modules/.bin on PATH, so a bare `oxfmt` silently exits 127 and the
    # formatter never runs. Jobs run from the repo root, so ./ resolves.
    - name: oxlint
      run: ./node_modules/.bin/oxlint {staged_files}
      glob: "*.{js,ts,vue,jsx,tsx}"
      stage_fixed: true
    - name: oxfmt
      run: ./node_modules/.bin/oxfmt {staged_files}
      glob: "*.{js,ts,vue,jsx,tsx,json,md,css}"
      stage_fixed: true
    - name: squawk
      run: ./node_modules/.bin/squawk {staged_files}
      glob: "supabase/migrations/*.sql"
