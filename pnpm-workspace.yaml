packages:
  - apps/*
# Never let a `pnpm run`/`pnpm exec` block on a reinstall prompt in a
# non-interactive context (git hooks, CI).
verifyDepsBeforeRun: false
allowBuilds:
  "@posthog/cli": true
  lefthook: true
  squawk-cli: true
  supabase: true
minimumReleaseAgeExclude:
  - expo-updates@56.0.26
